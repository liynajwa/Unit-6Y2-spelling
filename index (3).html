#end .big{font-size:56px;font-weight:bold;color:#7a4fc4}

const LV={rooms:["LIVING ROOM","DINING ROOM","BEDROOM","BATHROOM","KITCHEN","CELLAR","HALL","STAIRS"],animals:["SPIDERS","DUCKS","LIZARDS","MONSTERS","CATS"],numbers:["ONE","TWO","THREE","FOUR","FIVE","SIX","SEVEN","EIGHT","NINE","TEN"]};
const QT={rooms:"What room is this?",animals:"What animal is this?",numbers:"How many? Spell the number!"};
let WORDS=LV.rooms,lvl="rooms";
const ANI={SPIDERS:["sp","#efe3ff"],DUCKS:["du","#d9f1ff"],LIZARDS:["li","#e6f7cf"],MONSTERS:["mo","#ffe3ef"],CATS:["ca","#fff0cc"]};
const CYC=["du","ca","sp","li","mo"];
function getArt(w){
 if(ART[w])return ART[w];
 if(ANI[w])return S('<rect width="300" height="220" fill="'+ANI[w][1]+'"/><rect y="180" width="300" height="40" fill="#cfe8b5"/><use href="#'+ANI[w][0]+'" x="12" y="75" width="95" height="95"/><use href="#'+ANI[w][0]+'" x="102" y="25" width="100" height="100"/><use href="#'+ANI[w][0]+'" x="190" y="85" width="95" height="95"/><use href="#'+ANI[w][0]+'" x="95" y="110" width="90" height="90"/>');
 const n=idx+1,c=n<=5?n:5,r=Math.ceil(n/c),z=Math.min(120,270/c,185/r),t=CYC[idx%5];
 let b='<rect width="300" height="220" fill="#e8f4ff"/><rect y="188" width="300" height="32" fill="#cfe8b5"/>';
 for(let i=0;i<n;i++){const row=Math.floor(i/c),inRow=row<r-1?c:n-c*(r-1);const col=i%c;
  b+='<use href="#'+t+'" x="'+(150-inRow*z/2+col*z)+'" y="'+(105-r*z/2+row*z)+'" width="'+z+'" height="'+z+'"/>'}
 return S(b)}
function startLevel(l){lvl=l;WORDS=LV[l];idx=0;score=0;$("qq").textContent=QT[l];$("menu").style.display="none";$("end").style.display="none";$("game").style.display="block";load()}
function toMenu(){$("game").style.display="none";$("end").style.display="none";$("menu").style.display="block"}
const COL=["#ff6f91","#ff9671","#ffc75f","#4fc3a1","#4d8de8","#a58be0","#f06fbe","#42b9d9"];
let idx=0,score=0,tiles=[],slots=[],answer="",scored=false;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function load(){
 const w=WORDS[idx];answer=w.replace(/ /g,"");scored=false;slots=[];
 $("wn").textContent="Word "+(idx+1)+"/"+WORDS.length;$("sc").textContent="⭐ "+score;
 const art=$("art");art.innerHTML=getArt(w);
 const im=new Image();im.alt=w;im.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:cover";
 im.onload=()=>{art.innerHTML="";art.appendChild(im)};
 if(lvl==="rooms")im.src=PHOTOS[w];$("fb").textContent="";$("fb").className="";
 const t=$("tiles");t.innerHTML="";
 for(let i=0;i<16;i++){const b=document.createElement("button");b.className="tile";b.style.background=COL[(i+(i>>2))%8];b.textContent="?";b.onclick=()=>b.classList.add("gone");t.appendChild(b)}
 // letters: all needed + extras, shuffled
 let L=answer.split("");const ex="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").filter(c=>!L.includes(c));
 shuffle(ex);const target=Math.max(L.length+4,12);L=L.concat(ex.slice(0,target-L.length));shuffle(L);
 tiles=L.map((c,i)=>({c,used:false,col:COL[(i*3)%8]}));
 drawLetters();drawBoxes();
}
function drawLetters(){
 const d=$("letters");d.innerHTML="";
 tiles.forEach((t,i)=>{const b=document.createElement("button");b.className="l"+(t.used?" used":"");b.style.background=t.col;b.textContent=t.c;
  b.onclick=()=>{if(t.used||slots.length>=answer.length)return;t.used=true;slots.push(i);$("fb").textContent="";drawLetters();drawBoxes()};d.appendChild(b)});
}
function drawBoxes(){
 const d=$("boxes");d.innerHTML="";let k=0;const w=WORDS[idx];
 for(const ch of w){
  if(ch===" "){const g=document.createElement("div");g.className="gap";d.appendChild(g);continue}
  const b=document.createElement("div");const pos=k++;
  if(slots[pos]!==undefined){b.className="box f";b.textContent=tiles[slots[pos]].c;
   b.onclick=()=>{tiles[slots[pos]].used=false;slots.splice(pos,1);drawLetters();drawBoxes()}}
  else b.className="box";
  d.appendChild(b)}
}
$("clr").onclick=()=>{slots.forEach(i=>tiles[i].used=false);slots=[];$("fb").textContent="";drawLetters();drawBoxes()};
$("showAll").onclick=()=>document.querySelectorAll(".tile").forEach(b=>b.classList.add("gone"));
$("chk").onclick=()=>{
 const f=$("fb");
 if(slots.length<answer.length){f.textContent="Fill all the boxes first!";f.className="no";return}
 const g=slots.map(i=>tiles[i].c).join("").toUpperCase();
 if(g===answer){f.textContent="✅ Correct! Well done!";f.className="ok";
  if(!scored){scored=true;score++;$("sc").textContent="⭐ "+score}
  document.querySelectorAll(".tile").forEach(b=>b.classList.add("gone"))}
 else{f.textContent="❌ Not quite. Try again!";f.className="no"}
};
$("nxt").onclick=()=>{idx++;if(idx>=WORDS.length){$("game").style.display="none";$("end").style.display="block";
 $("fs").textContent=score+" / "+WORDS.length;$("fm").textContent=score==WORDS.length?"Perfect! 🌟":score>=WORDS.length*0.6?"Great job! Keep practising!":"Good try! Play again to learn more!"}else load()};
